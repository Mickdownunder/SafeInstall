name: "SafeInstall Policy Check"
description: "Run SafeInstall policy checks in CI. Blocks risky package installs before they land in your repo."
author: "Mickdownunder"

branding:
  icon: "shield"
  color: "green"

inputs:
  mode:
    description: >
      "check" evaluates direct dependencies against policy without
      installing. "install" runs the package manager through SafeInstall
      so policy and artifact binding are enforced before installation.
    required: false
    default: "check"
  package-manager:
    description: >
      Package manager to use in install mode (npm or pnpm; bun fails closed).
      Ignored in check mode.
    required: false
    default: "pnpm"
  args:
    description: >
      Additional arguments forwarded to the package manager in install
      mode. Example: "--frozen-lockfile". Ignored in check mode.
    required: false
    default: ""
  config-path:
    description: >
      Explicit path to safeinstall.config.json. If omitted, SafeInstall
      discovers the nearest config by walking upward from the project
      directory.
    required: false
    default: ""
  version:
    description: >
      Exact SafeInstall CLI version to install. Update this and integrity
      together after reviewing a release.
    required: false
    default: "0.15.0"
  integrity:
    description: >
      sha512 SRI of the selected SafeInstall CLI tarball (for example,
      sha512-...). Optional for the default version, whose digest is recorded
      in this Action. Required when `version` is set to anything else, so a
      registry or publishing account cannot replace the executable after this
      Action is pinned.
    required: false
    default: ""
  verify-trust:
    description: >
      When "true", verify the Agent Trust Surface before running the
      policy check: the committed .safeinstall/trust-surface.lock must
      exist and match the repository state. This catches tampering with
      SafeInstall config, agent hooks, rules files, and MCP configs —
      even when the tampering happened on a fully compromised local
      machine, because CI re-verifies the committed baseline.
    required: false
    default: "false"

outputs:
  decision:
    description: "Policy decision: allow or block"
    value: ${{ steps.run.outputs.decision }}
  summary:
    description: "Human-readable one-line summary"
    value: ${{ steps.run.outputs.summary }}
  exit-code:
    description: "SafeInstall exit code (0 = allow, 2 = block, 1 = error)"
    value: ${{ steps.run.outputs.exit_code }}
  json:
    description: "Full JSON result from SafeInstall"
    value: ${{ steps.run.outputs.json }}

runs:
  using: "composite"
  steps:
    - name: Install SafeInstall CLI
      shell: bash
      env:
        SAFEINSTALL_CLI_VERSION: ${{ inputs.version }}
        SAFEINSTALL_CLI_INTEGRITY: ${{ inputs.integrity }}
      run: |
        set -euo pipefail

        # The default CLI version and the digest of its published tarball are
        # recorded together, so a workflow that pins this Action by commit
        # also pins the executable. Bump both in the same change.
        SAFEINSTALL_DEFAULT_VERSION="0.15.0"
        SAFEINSTALL_DEFAULT_INTEGRITY="sha512-GjMB+YaFv7WtewK/JpCHndgWFTnAdQREUQUuLruzEzR3+rDhBElyKdf3fm/cK3ZrsGPtJayTU9aWkHoCrttBbg=="
        if [ -z "$SAFEINSTALL_CLI_INTEGRITY" ] && [ "$SAFEINSTALL_CLI_VERSION" = "$SAFEINSTALL_DEFAULT_VERSION" ]; then
          SAFEINSTALL_CLI_INTEGRITY="$SAFEINSTALL_DEFAULT_INTEGRITY"
        fi
        export SAFEINSTALL_CLI_INTEGRITY

        node -e '
          const version = process.env.SAFEINSTALL_CLI_VERSION || "";
          const integrity = process.env.SAFEINSTALL_CLI_INTEGRITY || "";
          const exactVersion = /^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (!exactVersion.test(version)) {
            console.error("Invalid SafeInstall version: expected an exact semantic version such as `version: 0.15.0`, not a dist-tag (latest, next) or a range.");
            process.exit(2);
          }
          if (!integrity.startsWith("sha512-")) {
            console.error("SafeInstall Action: the `integrity` input is required when `version` is not the default. Add `integrity: sha512-...` (the dist.integrity of safeinstall-cli@" + version + ", verified against the release provenance, for example `npm view safeinstall-cli@" + version + " dist.integrity`) next to `version: " + version + "`, and pin this Action to a reviewed commit SHA.");
            process.exit(2);
          }
          const encoded = integrity.slice("sha512-".length);
          const digest = Buffer.from(encoded, "base64");
          if (digest.length !== 64 || digest.toString("base64") !== encoded) {
            console.error("Invalid SafeInstall integrity: expected a canonical sha512 SRI.");
            process.exit(2);
          }
        '

        SAFEINSTALL_TARBALL="${RUNNER_TEMP:?}/safeinstall-cli-${SAFEINSTALL_CLI_VERSION}.tgz"
        curl --proto '=https' --proto-redir '=https' --tlsv1.2 \
          --fail --silent --show-error --location \
          "https://registry.npmjs.org/safeinstall-cli/-/safeinstall-cli-${SAFEINSTALL_CLI_VERSION}.tgz" \
          --output "$SAFEINSTALL_TARBALL"

        node -e '
          const { createHash, timingSafeEqual } = require("node:crypto");
          const { readFileSync } = require("node:fs");
          const expected = Buffer.from(process.env.SAFEINSTALL_CLI_INTEGRITY.slice("sha512-".length), "base64");
          const actual = createHash("sha512").update(readFileSync(process.argv[1])).digest();
          if (!timingSafeEqual(actual, expected)) {
            console.error("SafeInstall tarball integrity mismatch; refusing to install.");
            process.exit(2);
          }
        ' "$SAFEINSTALL_TARBALL"

        npm install -g "$SAFEINSTALL_TARBALL" --ignore-scripts

    - name: Verify trust surface
      if: ${{ inputs.verify-trust == 'true' }}
      shell: bash
      run: |
        set +e
        OUTPUT=$(safeinstall trust status --require-lock --json 2>/dev/null)
        EXIT_CODE=$?

        if [ $EXIT_CODE -ne 0 ]; then
          echo "### :x: SafeInstall — Trust surface drift" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT"
        fi

        exit $EXIT_CODE

    - name: Run SafeInstall
      id: run
      shell: bash
      env:
        SAFEINSTALL_MODE: ${{ inputs.mode }}
        SAFEINSTALL_PM: ${{ inputs.package-manager }}
        SAFEINSTALL_ARGS: ${{ inputs.args }}
        SAFEINSTALL_CONFIG: ${{ inputs.config-path }}
      run: |
        set +e

        SAFEINSTALL_CMD=(safeinstall --json)
        if [ -n "$SAFEINSTALL_CONFIG" ]; then
          SAFEINSTALL_CMD+=(--config "$SAFEINSTALL_CONFIG")
        fi

        if [ "$SAFEINSTALL_MODE" = "install" ]; then
          IFS=$' \t\n' read -r -d '' -a SAFEINSTALL_EXTRA_ARGS < <(printf '%s\0' "$SAFEINSTALL_ARGS")
          for ARG in "${SAFEINSTALL_EXTRA_ARGS[@]}"; do
            if [ "$ARG" = "--config" ] || [[ "$ARG" == --config=* ]]; then
              echo "SafeInstall Action: args must not contain --config; use the config-path input." >&2
              exit 2
            fi
          done
          SAFEINSTALL_CMD+=("$SAFEINSTALL_PM" install "${SAFEINSTALL_EXTRA_ARGS[@]}")
        else
          SAFEINSTALL_CMD+=(check)
        fi

        echo "::group::SafeInstall command"
        echo "Running SafeInstall (arguments are not printed to avoid leaking credentials)."
        echo "::endgroup::"

        OUTPUT=$("${SAFEINSTALL_CMD[@]}" 2>/dev/null)
        EXIT_CODE=$?

        DECISION=$(echo "$OUTPUT" | grep -o '"decision":\s*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
        SUMMARY=$(echo "$OUTPUT" | grep -o '"summary":\s*"[^"]*"' | head -1 | sed 's/.*"\([^"]*\)"$/\1/')

        if [ -z "$DECISION" ]; then
          DECISION="error"
        fi
        if [ -z "$SUMMARY" ]; then
          SUMMARY="SafeInstall did not produce a parseable result."
        fi

        echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
        echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

        {
          echo 'json<<SAFEINSTALL_JSON_EOF'
          echo "$OUTPUT"
          echo 'SAFEINSTALL_JSON_EOF'
        } >> "$GITHUB_OUTPUT"

        # Write job summary
        if [ "$DECISION" = "allow" ]; then
          echo "### :white_check_mark: SafeInstall — Policy passed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        elif [ "$DECISION" = "block" ]; then
          echo "### :x: SafeInstall — Policy blocked" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "<details><summary>Full JSON output</summary>" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "</details>" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "### :warning: SafeInstall — Error" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$SUMMARY" >> "$GITHUB_STEP_SUMMARY"
        fi

        exit $EXIT_CODE
