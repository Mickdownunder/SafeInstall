version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Actions are SHA-pinned with a `# vX.Y.Z` comment; Dependabot updates
    # both the SHA and the comment together.
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Security-sensitive CLI: keep majors and security updates isolated while
    # grouping routine version updates into one reviewable PR.
    versioning-strategy: increase-if-necessary
    groups:
      routine-npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
