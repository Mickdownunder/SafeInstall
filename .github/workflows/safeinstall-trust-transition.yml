name: SafeInstall Trust Transition

# Temporary compatibility gate for the PR that introduces the trusted-base
# workflow. `pull_request_target` workflows only become active after they exist
# on main. Remove this file after the first successful trust-base validation and
# switch the branch ruleset from `trust` to `trust-base`.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm install -g safeinstall-cli@0.10.1
      - run: safeinstall trust status --require-lock
