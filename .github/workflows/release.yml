name: Release to npm

on:
  push:
    tags:
      # Only full semver release tags (v0.4.0, v1.2.3) trigger a publish.
      # The floating major tag used by the GitHub Action (v1) is moved on
      # every release and must NOT re-trigger npm publish.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm release:check

      - name: Build the immutable publish artifact
        run: |
          mkdir release-artifact
          npm pack --ignore-scripts --pack-destination release-artifact

      - name: Upload verified package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: release-artifact/safeinstall-cli-*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Approval happens before this job starts and before GitHub exposes the
    # OIDC request endpoint. No repository checkout or dependency build occurs
    # in this privileged job: it publishes only the artifact verified above.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # Exact npm pin, installed without lifecycle scripts. Bump deliberately
      # after re-checking Node engine and provenance support.
      - run: npm install -g npm@11.18.0 --ignore-scripts

      - name: Download verified package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release-artifact

      - name: Bind artifact filename to the release tag
        run: |
          node -e 'const fs=require("node:fs"); const tag=process.env.GITHUB_REF_NAME; if(!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error(`Invalid release tag: ${tag}`); const expected=`safeinstall-cli-${tag.slice(1)}.tgz`; const files=fs.readdirSync("release-artifact"); if(files.length!==1 || files[0]!==expected) throw new Error(`Expected only ${expected}, received ${files.join(", ")}`); fs.renameSync(`release-artifact/${expected}`, "release-artifact/package.tgz");'

      - run: npm publish ./release-artifact/package.tgz --ignore-scripts --provenance --access public
