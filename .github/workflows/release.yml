name: Release to npm

on:
  push:
    tags:
      # Only full semver release tags (v0.4.0, v1.2.3) trigger a publish.
      # The floating major tag used by the GitHub Action (v1) is moved on
      # every release and must NOT re-trigger npm publish.
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile

      - run: pnpm release:check

      - run: npm publish --provenance --access public
