name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development
          # picomatch <= 4.0.7 (ReDoS through repeated extglobs): no patched
          # version exists, 4.0.7 is the latest release. It is a development
          # dependency of the test and build tooling, is not shipped in the
          # package, and receives no untrusted patterns here. Without this
          # entry every lockfile change is rejected, including the ones that
          # fix other advisories. Remove it once a fixed version is published.
          allow-ghsas: GHSA-fc5q-39xc-vjpf
          comment-summary-in-pr: never
