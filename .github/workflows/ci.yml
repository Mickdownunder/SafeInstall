name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel instead of macos-latest: the arm64 macOS pool was short
        # of capacity ("job was not acquired by Runner of type hosted") and
        # cancelled queued jobs after 15 minutes, which blocked every merge.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  # ESLint is OS-independent, so it runs once instead of across the test matrix.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

  # Stable aggregate check for branch protection: require "ci-ok" instead of
  # per-OS matrix job names, which change when the matrix changes.
  ci-ok:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Fail if a required job did not succeed
        if: needs.test.result != 'success' || needs.lint.result != 'success'
        run: exit 1
