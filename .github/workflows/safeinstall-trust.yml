name: SafeInstall Trusted Base Verification

# The verification logic is invoked from the external, code-owner-locked
# verifier repository BY FULL COMMIT SHA (RFC-001 §13 K1). This workflow file
# is loaded from the protected base branch (pull_request_target); the PR
# candidate is checked out only as inert data and never executed. A pull
# request against THIS repo cannot alter what runs — bumping the pinned SHA is
# an enforcement-zone change requiring review, and the verifier repo pins the
# CLI version + sha512 outside this repo entirely.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust-base:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request candidate as data
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false

      - name: Check out protected main revision
        if: github.event_name == 'push'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: candidate
          persist-credentials: false

      # Verification runs from the external verifier repo, pinned by full commit
      # SHA — never a branch or tag. The verifier installs an integrity-pinned
      # safeinstall-cli (version + sha512 recorded in that repo's pin.json) and
      # runs trust status against the candidate, which it treats strictly as
      # data. Bumping this SHA is an enforcement-zone change requiring review.
      - name: SafeInstall trusted verification
        uses: Mickdownunder/safeinstall-verifier@a3da984c3ec1cbcebbd837e7d54dac0e35051bf2 # v0.1.2 (safeinstall-cli 0.14.0)
        with:
          candidate-path: candidate
